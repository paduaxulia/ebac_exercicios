<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main class="w-100 m-auto form-container">
        <form>
            <h1 class="h3 mb-3 fw-normal">Formulário de Cadastro</h1>
            <div class="form-floating">
                <input type="text" class="form-control" id="floatingInput" placeholder="Seu Nome" />
                <label for="floatingInput">Nome</label>
            </div>
            <div class="form-floating">
                <input type="email" class="form-control" id="floatingInput" placeholder="seuemail@gmail.com" />
                <label for="floatingInput">Email</label>
            </div>
            <button class="btn mt-4 btn-primary w-100 py-2" type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
